name: Check upstream release

# Prueft stuendlich, ob kerrdec97/PS5-Backport-GUI eine neue EXE veroeffentlicht hat
# (Kanal ueber Repo-Variable UPSTREAM_TAG_REGEX, Standard ^early-testing-beta)
# (neuer Release-Tag oder ersetzte Datei im selben Tag). Bei Aenderung wird
# upstream.env aktualisiert und das Image neu gebaut. Die EXE selbst kommt nicht ins Image.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: check-upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - id: latest
        name: Get newest upstream release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Welche Release-Tags verfolgt werden (ERE). Standard: nur der Early-Testing-Beta-Kanal,
          # reine Test-Builds (testing-*) werden uebersprungen. Aendern: Repo-Variable UPSTREAM_TAG_REGEX,
          # z. B. '.' fuer alle Releases inkl. testing-*.
          TAG_REGEX: ${{ vars.UPSTREAM_TAG_REGEX || '^early-testing-beta' }}
        run: |
          set -euo pipefail
          REPO=kerrdec97/PS5-Backport-GUI
          gh api "repos/$REPO/releases?per_page=30" \
            --jq '.[] | select(.draft | not) | [.tag_name, ([.assets[].name] | join("|"))] | @tsv' > "$RUNNER_TEMP/releases.tsv"
          FOUND=""
          while IFS=$'\t' read -r TAG ASSETS; do
            if ! printf '%s\n' "$TAG" | grep -Eq "$TAG_REGEX"; then echo "skip $TAG (Filter $TAG_REGEX)"; continue; fi
            case "|$ASSETS|" in *"|SHA256SUMS.txt|"*) ;; *) echo "skip $TAG (kein SHA256SUMS.txt)"; continue ;; esac
            rm -f "$RUNNER_TEMP/SHA256SUMS.txt"
            gh release download "$TAG" --repo "$REPO" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP" --clobber
            # Seit 0.3.3 heisst die EXE versioniert (PS5BackportGUI-0.3.3.exe), vorher PS5BackportGUI.exe
            LINE=$(grep -iE '^[0-9a-fA-F]{64}[[:space:]]+\*?PS5BackportGUI[^[:space:]/]*\.exe[[:space:]]*$' "$RUNNER_TEMP/SHA256SUMS.txt" | head -n1 || true)
            SHA=$(printf '%s\n' "$LINE" | awk '{print tolower($1)}')
            EXE=$(printf '%s\n' "$LINE" | awk '{print $2}' | sed 's/^\*//')
            if [ -z "$LINE" ]; then echo "skip $TAG (keine PS5BackportGUI*.exe in SHA256SUMS.txt)"; cat "$RUNNER_TEMP/SHA256SUMS.txt"; continue; fi
            case "|$ASSETS|" in *"|$EXE|"*) ;; *) echo "skip $TAG ($EXE nicht als Asset vorhanden)"; continue ;; esac
            FOUND=1
            break
          done < "$RUNNER_TEMP/releases.tsv"
          [ -n "$FOUND" ] || { echo "Kein passendes Release gefunden"; cat "$RUNNER_TEMP/releases.tsv"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"
          echo "Upstream: $TAG $EXE $SHA"

      - id: cmp
        name: Compare with upstream.env
        run: |
          set -euo pipefail
          . ./upstream.env
          if [ "$UPSTREAM_TAG" = "${{ steps.latest.outputs.tag }}" ] && [ "$UPSTREAM_SHA256" = "${{ steps.latest.outputs.sha }}" ] \
             && [ "${UPSTREAM_EXE:-}" = "${{ steps.latest.outputs.exe }}" ]; then
            echo "Unveraendert"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Neu: ${{ steps.latest.outputs.tag }} ${{ steps.latest.outputs.sha }} (vorher $UPSTREAM_TAG $UPSTREAM_SHA256)"
            printf 'UPSTREAM_TAG=%s\nUPSTREAM_SHA256=%s\nUPSTREAM_EXE=%s\n' "${{ steps.latest.outputs.tag }}" "${{ steps.latest.outputs.sha }}" "${{ steps.latest.outputs.exe }}" > upstream.env
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit upstream.env
        if: steps.cmp.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream.env
          git commit -m "Upstream update: ${{ steps.latest.outputs.tag }} (${{ steps.latest.outputs.sha }})"
          git push

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/docker.yml
    with:
      ref: main
